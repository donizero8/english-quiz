<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dialog Voice</title>
  <link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
  <main>
    <section class="hero">
      <span class="eyebrow">TEXT → CONVERSATION</span>
      <h1>Buat teksmu<br>jadi percakapan.</h1>
      <p>Dua karakter, satu audio. Tulis dialog, pilih play, dan dengarkan hasilnya.</p>
    </section>

    <section class="studio">
      <div class="labels"><span><i class="dot a"></i> Voice A</span><span><i class="dot b"></i> Voice B</span></div>
      <label for="dialogue">Naskah percakapan</label>
      <textarea id="dialogue" spellcheck="false">Voice A: Hi, how are you doing today?
Voice B: I'm doing great, thanks. How about you?</textarea>
      <div class="actions">
        <span id="counter">2 baris dialog</span>
        <button id="generate">Generate audio <span>→</span></button>
      </div>
      <p id="error" role="alert"></p>

      <div id="result" class="result hidden">
        <div class="disc">♪</div>
        <div class="track">
          <strong>Conversation ready</strong>
          <small id="meta">Voice A + Voice B</small>
          <audio id="player" controls></audio>
        </div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
